
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phishing URL Awareness Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
      color: #1f2937;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 18px #0001;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    li { margin: 10px 0; }
    .note { color: #555; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Phishing URL Awareness Checker</h1>
  <p>Check a URL for selected warning signs. This tool does not open the URL.</p>

  <form id="checker">
    <label for="url">Enter a sample URL</label>
    <input id="url" type="text" placeholder="https://example.com" required>
    <button type="submit">Check URL</button>
  </form>

  <section id="results" aria-live="polite"></section>
  <p class="note">
    This is an awareness tool, not a definitive phishing detector.
    HTTPS does not guarantee that a website is trustworthy.
  </p>
</main>

<script>
function inspectUrl(raw) {
  const url = raw.trim();
  const findings = [];

  if (!url) return ["No URL entered."];

  let parsed;
  try {
    parsed = new URL(url.includes("://") ? url : "http://" + url);
  } catch {
    return ["This text is not a valid URL format."];
  }

  const host = parsed.hostname.toLowerCase();

  if (!host || host.includes(" ")) {
    return ["Could not identify a hostname."];
  }

  if (url.includes("@")) {
    findings.push("Contains an @ symbol; inspect carefully.");
  }
  if (url.length > 100) {
    findings.push("Unusually long URL (over 100 characters).");
  }
  if (/^(?:\d{1,3}\.){3}\d{1,3}$/.test(host)) {
    findings.push("Uses an IP address instead of a familiar domain.");
  }
  if (host.split(".").filter(Boolean).length >= 5) {
    findings.push("Contains many hostname segments/subdomains.");
  }
  if (host.includes("xn--")) {
    findings.push("Contains a punycode-style hostname.");
  }
  if (parsed.protocol === "http:") {
    findings.push("Uses HTTP. HTTPS alone does not prove trust.");
  }
  if (!findings.length) {
    findings.push("No listed warning signs found. This does NOT prove safety.");
  }
  return findings;
}

document.getElementById("checker").addEventListener("submit", event => {
  event.preventDefault();
  const findings = inspectUrl(document.getElementById("url").value);
  const results = document.getElementById("results");
  results.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = "Result";
  results.appendChild(heading);

  const list = document.createElement("ul");
  findings.forEach(item => {
    const li = document.createElement("li");
    li.textContent = item;
    list.appendChild(li);
  });
  results.appendChild(list);
});
</script>
</body>
</html>
